<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E0F11">
<title>VIRAJ · Suivi en direct</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root { --bg:#0E0F11; --panel:#17191C; --ink:#EDEDEB; --muted:#9A9EA4; --amber:#F2A33A; --good:#4CC38A; --bad:#E5484D; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  #map { position:fixed; inset:0; }
  .card { position:fixed; left:12px; right:12px; top:calc(env(safe-area-inset-top) + 12px); background:rgba(23,25,28,.94); border:1px solid #2A2D31; border-radius:20px; padding:14px 16px; box-shadow:0 8px 30px rgba(0,0,0,.35); backdrop-filter:blur(8px); }
  .row { display:flex; align-items:center; gap:10px; }
  .brand { color:var(--amber); font-weight:700; letter-spacing:2px; font-size:11px; }
  .who { font-size:20px; font-weight:700; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill { font-size:12px; font-weight:700; padding:5px 10px; border-radius:20px; border:1.5px solid currentColor; white-space:nowrap; }
  .stats { display:flex; gap:18px; margin-top:10px; }
  .stat b { display:block; font-size:26px; line-height:1.1; }
  .stat span { color:var(--muted); font-size:12px; }
  .upd { color:var(--muted); font-size:12px; margin-top:8px; }
  .alert { position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 84px); background:var(--bad); color:#fff; border-radius:18px; padding:16px; font-weight:600; display:none; }
  .alert a { display:block; margin-top:10px; background:#fff; color:var(--bad); text-align:center; padding:12px; border-radius:12px; text-decoration:none; font-weight:800; }
  .btns { position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 16px); display:flex; gap:10px; }
  .btn { flex:1; height:52px; border-radius:26px; border:none; background:rgba(23,25,28,.94); color:var(--ink); font-size:15px; font-weight:700; border:1px solid #2A2D31; }
  .btn.on { background:var(--amber); color:#111; border-color:var(--amber); }
  .moto { width:44px; height:44px; border-radius:22px; background:var(--amber); border:3px solid #fff; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 8px rgba(242,163,58,.25); }
  .moto svg { transition: transform .6s; }
  .moto.av { width:52px; height:52px; border-radius:26px; background:rgba(14,15,17,.85); border:2.5px solid var(--amber); }
  .moto.av svg { width:46px; height:46px; }
  .dest { width:16px; height:16px; border-radius:8px; background:#fff; border:4px solid var(--good); }
  .msg { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:30px; color:var(--muted); font-size:16px; pointer-events:none; }
</style>
</head>
<body>
<div id="map"></div>
<div class="card">
  <div class="brand">VIRAJ · SUIVI EN DIRECT</div>
  <div class="row" style="margin-top:4px">
    <div class="who" id="who">Connexion…</div>
    <div class="pill" id="pill" style="color:var(--muted)">…</div>
  </div>
  <div class="stats">
    <div class="stat"><b id="speed">–</b><span>km/h</span></div>
    <div class="stat"><b id="eta">–</b><span id="etaL">arrivée prévue</span></div>
    <div class="stat"><b id="left">–</b><span>restants</span></div>
  </div>
  <div class="upd" id="upd">En attente de la position…</div>
</div>
<div class="alert" id="alert">⚠️ Chute possible détectée : il n'a pas répondu à l'alerte. Appelle-le tout de suite ; sans réponse, appelle le 112 avec sa position.
  <a href="tel:112">Appeler le 112</a>
</div>
<div class="btns">
  <button class="btn on" id="follow">Suivre la moto</button>
  <button class="btn" id="whole">Tout le trajet</button>
</div>
<div class="msg" id="msg"></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  // ---------- lien : #identifiant.clé (la clé ne quitte jamais ce téléphone) ----------
  var h = location.hash.slice(1).split('.');
  var ID = h[0], KEY = h[1];
  var $ = function (id) { return document.getElementById(id); };
  if (!ID || !KEY) { $('msg').textContent = 'Lien de suivi incomplet. Demande un nouveau lien.'; $('who').textContent = 'Lien invalide'; return; }

  // ---------- déchiffrement (même algorithme que l'appli) ----------
  function enc(s) { var o = []; for (var ch of s) { var c = ch.codePointAt(0); if (c < 128) o.push(c); else if (c < 2048) o.push(192 | (c >> 6), 128 | (c & 63)); else if (c < 65536) o.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63)); else o.push(240 | (c >> 18), 128 | ((c >> 12) & 63), 128 | ((c >> 6) & 63), 128 | (c & 63)); } return o; }
  function dec(b) { var s = ''; for (var i = 0; i < b.length;) { var c = b[i++]; if (c < 128) s += String.fromCharCode(c); else if (c < 224) s += String.fromCharCode(((c & 31) << 6) | (b[i++] & 63)); else if (c < 240) s += String.fromCharCode(((c & 15) << 12) | ((b[i++] & 63) << 6) | (b[i++] & 63)); else s += String.fromCodePoint(((c & 7) << 18) | ((b[i++] & 63) << 12) | ((b[i++] & 63) << 6) | (b[i++] & 63)); } return s; }
  function hash32(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function stream(key, nonce) {
    var a = hash32(key + ':' + nonce), b = hash32(nonce + ':' + key + ':v');
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      b = (Math.imul(b ^ (b >>> 13), 0x5bd1e995) + 0x9e3779b9) >>> 0;
      return (((t ^ (t >>> 14)) ^ (b >>> 7)) >>> 0) & 255;
    };
  }
  function openMsg(raw) {
    var p = raw.split('.'); if (p.length !== 2 || p[1].length % 2) return null;
    var next = stream(KEY, parseInt(p[0], 36)), bytes = [];
    for (var i = 0; i < p[1].length; i += 2) bytes.push(parseInt(p[1].slice(i, i + 2), 16) ^ next());
    try { return JSON.parse(dec(bytes)); } catch (e) { return null; }
  }

  // ---------- relais MQTT (WebSocket) ----------
  var BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
  var TOPIC = 'viraj/t/' + ID;
  function str(s) { var b = enc(s); return [b.length >> 8, b.length & 255].concat(b); }
  function len(n) { var o = []; do { var d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; o.push(d); } while (n > 0); return o; }
  function pk(t, b) { return new Uint8Array([t].concat(len(b.length), b)); }
  var ws = null, bi = 0, buf = [], ping = null, connected = false;
  function connect() {
    try { ws = new WebSocket(BROKERS[bi % BROKERS.length], ['mqtt']); } catch (e) { bi++; setTimeout(connect, 2000); return; }
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () { ws.send(pk(0x10, str('MQTT').concat([4, 2, 0, 30], str('vs' + Math.random().toString(36).slice(2, 10))))); };
    ws.onmessage = function (e) { var b = new Uint8Array(e.data); for (var i = 0; i < b.length; i++) buf.push(b[i]); parse(); };
    ws.onclose = function () { connected = false; if (ping) clearInterval(ping); bi++; buf = []; setTimeout(connect, 2500); render(); };
    ws.onerror = function () {};
  }
  function parse() {
    for (;;) {
      if (buf.length < 2) return;
      var mult = 1, n = 0, i = 1, d;
      do { if (i >= buf.length) return; d = buf[i++]; n += (d & 127) * mult; mult *= 128; } while (d & 128);
      if (buf.length < i + n) return;
      var hdr = buf[0], type = hdr >> 4, body = buf.slice(i, i + n);
      buf = buf.slice(i + n);
      if (type === 2) {
        if (body[1] !== 0) { ws.close(); return; }
        connected = true;
        ws.send(pk(0x82, [0, 1].concat(str(TOPIC + '/#'), [0])));
        if (ping) clearInterval(ping);
        ping = setInterval(function () { try { ws.send(new Uint8Array([0xc0, 0])); } catch (e) {} }, 20000);
        render();
      } else if (type === 3) {
        var tl = (body[0] << 8) | body[1];
        var topic = dec(body.slice(2, 2 + tl));
        var qos = (hdr >> 1) & 3;
        var payload = dec(body.slice(2 + tl + (qos ? 2 : 0)));
        receive(topic, payload);
      }
    }
  }

  // ---------- carte ----------
  var map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty', center: [2.35, 46.6], zoom: 5, attributionControl: { compact: true } });
  var follow = true, ready = false, me = null, route = null, path = [], live = [], fittedOnce = false;
  var el = document.createElement('div');
  el.className = 'moto';
  el.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2l7 19-7-4-7 4z" fill="#111"/></svg>';
  var marker = new maplibregl.Marker({ element: el });
  var dEl = document.createElement('div'); dEl.className = 'dest';
  var destMarker = new maplibregl.Marker({ element: dEl });
  var empty = { type: 'FeatureCollection', features: [] };
  function line(c) { return { type: 'FeatureCollection', features: c && c.length > 1 ? [{ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: c } }] : [] }; }
  map.on('load', function () {
    map.addSource('route', { type: 'geojson', data: empty });
    map.addSource('path', { type: 'geojson', data: empty });
    map.addLayer({ id: 'route', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#3D8BFD', 'line-width': 5, 'line-opacity': 0.55 } });
    map.addLayer({ id: 'path', type: 'line', source: 'path', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#F2A33A', 'line-width': 6 } });
    ready = true; draw();
  });
  map.on('dragstart', function () { setFollow(false); });
  function setFollow(on) { follow = on; $('follow').classList.toggle('on', on); if (on && me) map.easeTo({ center: [me.lng, me.lat], zoom: Math.max(map.getZoom(), 15), duration: 600 }); }
  $('follow').onclick = function () { setFollow(true); };
  $('whole').onclick = function () {
    setFollow(false);
    var pts = (route || []).concat(path, me ? [[me.lng, me.lat]] : []);
    if (!pts.length) return;
    var b = new maplibregl.LngLatBounds(pts[0], pts[0]); pts.forEach(function (p) { b.extend(p); });
    map.fitBounds(b, { padding: { top: 200, bottom: 110, left: 40, right: 40 }, maxZoom: 15, duration: 700 });
  };
  function draw() {
    if (!ready) return;
    map.getSource('route').setData(line(route));
    map.getSource('path').setData(line(path.concat(live)));
    if (me) {
      marker.setLngLat([me.lng, me.lat]).addTo(map);
      el.querySelector('svg').style.transform = 'rotate(' + (me.hd || 0) + 'deg)';
      if (me.dest) destMarker.setLngLat([me.dest.lng, me.dest.lat]).addTo(map);
      // première position : on saute directement dessus, ensuite on suit en douceur
      if (!fittedOnce) { map.jumpTo({ center: [me.lng, me.lat], zoom: 15 }); fittedOnce = true; }
      else if (follow) map.easeTo({ center: [me.lng, me.lat], duration: 900 });
    }
  }

  // ---------- avatar du motard (moto vue de dessus) ----------
  function avatar(svg) {
    if (typeof svg !== 'string' || svg.length > 20000) return;
    var doc = new DOMParser().parseFromString(svg, 'image/svg+xml'), root = doc.documentElement;
    if (!root || root.nodeName !== 'svg') return;
    // on ne garde que du dessin : pas de script, pas de lien, pas d'événement
    var ok = { svg: 1, g: 1, path: 1, rect: 1, circle: 1, ellipse: 1, line: 1, polygon: 1, polyline: 1, defs: 1, linearGradient: 1, radialGradient: 1, stop: 1 };
    var all = [root].concat([].slice.call(root.querySelectorAll('*')));
    for (var i = 0; i < all.length; i++) {
      var n = all[i];
      if (!ok[n.nodeName]) { n.parentNode && n.parentNode.removeChild(n); continue; }
      [].slice.call(n.attributes).forEach(function (a) { if (/^on|href/i.test(a.name) || /javascript:|url[(]/i.test(a.value)) n.removeAttribute(a.name); });
    }
    root.setAttribute('width', '46'); root.setAttribute('height', '46');
    el.className = 'moto av';
    el.innerHTML = '';
    el.appendChild(document.importNode(root, true));
    draw();
  }

  // ---------- messages ----------
  function receive(topic, raw) {
    var m = openMsg(raw);
    if (!m) return;
    var sub = topic.slice(TOPIC.length);
    if (sub === '/r') route = m.c;
    else if (sub === '/p') { path = m.c || []; live = []; }
    else if (sub === '/a') { avatar(m.svg); return; }
    else if (sub === '') {
      if (me && me.at === m.at) return;
      me = m;
      if (!live.length || Math.abs(live[live.length - 1][0] - m.lng) + Math.abs(live[live.length - 1][1] - m.lat) > 0.0002) live.push([m.lng, m.lat]);
    }
    draw(); render();
  }
  var STATE = { route: ['En route', 'var(--good)'], arret: ['À l’arrêt', 'var(--amber)'], arrive: ['Arrivé', 'var(--good)'], fin: ['Balade terminée', 'var(--muted)'], chute: ['ALERTE CHUTE', 'var(--bad)'] };
  function hhmm(t) { var d = new Date(t); return ('0' + d.getHours()).slice(-2) + 'h' + ('0' + d.getMinutes()).slice(-2); }
  function ago(ms) { var s = Math.round(ms / 1000); if (s < 60) return 'il y a ' + s + ' s'; var m = Math.round(s / 60); if (m < 60) return 'il y a ' + m + ' min'; return 'à ' + hhmm(Date.now() - ms); }
  function km(m) { return m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1).replace('.', ',') + ' km' : Math.round(m / 10) * 10 + ' m'; }
  function render() {
    if (!me) {
      $('who').textContent = connected ? 'En attente…' : 'Connexion…';
      $('upd').textContent = connected ? 'Connecté. La position s’affichera dès que la moto émet (réseau mobile nécessaire).' : 'Connexion au suivi…';
      return;
    }
    var st = STATE[me.st] || STATE.route, age = Date.now() - me.at;
    var lost = age > 60000 && (me.st === 'route' || me.st === 'arret');
    $('who').textContent = me.n || 'Motard';
    $('pill').textContent = lost ? 'Signal perdu' : st[0];
    $('pill').style.color = lost ? 'var(--amber)' : st[1];
    $('speed').textContent = me.st === 'route' && !lost ? Math.round(me.sp) : '0';
    $('eta').textContent = me.eta && me.st !== 'arrive' && me.st !== 'fin' ? hhmm(me.eta) : (me.st === 'arrive' ? hhmm(me.at) : '–');
    $('etaL').textContent = me.st === 'arrive' ? 'arrivé à' : 'arrivée prévue';
    $('left').textContent = me.left != null && me.st !== 'arrive' ? km(me.left) : '–';
    var where = me.dest ? ' · vers ' + me.dest.n : '';
    $('upd').textContent = (lost ? 'Plus de signal depuis ' + ago(age).replace('il y a ', '') + ' (zone sans réseau ?). Dernière position affichée.' : 'Mis à jour ' + ago(age)) + where;
    if (me.st === 'arret' && me.since) $('upd').textContent += ' · arrêté depuis ' + ago(Date.now() - me.since).replace('il y a ', '');
    $('alert').style.display = me.st === 'chute' ? 'block' : 'none';
    document.title = (me.st === 'chute' ? '⚠️ ' : '') + (me.n || 'Motard') + ' · ' + st[0];
  }
  setInterval(render, 1000);
  connect();
})();
</script>
</body>
</html>
